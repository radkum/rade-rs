[package]
name = "rade"
version = "0.1.0"
description = "Real-Time Advanced Detection Engine"
authors = ["radkum <radoslaw.kumorekit@gmail.com>"]
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
repository = "https://github.com/radkum/rade-rs"
homepage = "https://github.com/radkum/rade-rs"
readme = "Readme.md"
keywords = ["security", "detection", "rules", "dsl", "parser"]
categories = ["development-tools", "parsing", "no-std"]

[lib]
path = "src/lib.rs"

[[bench]]
name = "engine_benchmarks"
harness = false

[dependencies]
anyhow = "1.0"
bincode = { version = "2.0.0-rc.3", features = ["serde", "alloc"]}
hashbrown = { version = "0.15", features = ["serde"] }
hex = "~0"
log = "~0"
regex = "1.11.0"
pest = "2"
pest_derive = { version = "2.8.6", default-features = false }
serde = { workspace = true, features = ["derive", "rc"] }
serde_yaml_bw = "=2.0.0"
sha2 = "0.10"
spin = { version = "0.9", default-features = false, features = ["lazy"] }
uuid = { version = "1.18.1", features = ["serde"] }
thiserror-no-std = "2.0"
rade-macros = { path = "../rade-macros", version = "0.1.0" }

[features]
default = ["std"]
std = []

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
