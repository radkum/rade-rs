[package]
name = "rade-cli"
version = "0.1.2"
description = "Command-line interface for the RADE detection engine"
authors = ["radkum <radoslaw.kumorekit@gmail.com>"]
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
repository = "https://github.com/radkum/rade-rs"
homepage = "https://github.com/radkum/rade-rs"
readme = "Readme.md"
keywords = ["security", "detection", "cli", "rules"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
env_logger = "0.10"
log = "~0"
rade = { path = "../rade", version = "0.1.2" }
